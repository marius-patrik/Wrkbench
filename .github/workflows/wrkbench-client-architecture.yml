name: Wrkbench client architecture
on:
  push:
    branches:
      - agent/wrkbench-client-architecture
  pull_request:
    branches:
      - pmarius/wrkbench-pages-react19
permissions:
  contents: read
jobs:
  verify-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        working-directory: next
        run: bun install
      - name: Typecheck real React 19, Cordis, Dockview packages
        working-directory: next
        run: bun run typecheck
      - name: Verify plugin boundaries and imports
        working-directory: next
        run: bun run test:core
      - name: Build Pages application
        working-directory: next
        run: bun run build
      - name: Require entrypoint
        run: test -s next/dist/index.html
