name: Wrkbench client architecture
on:
  pull_request:
    branches:
      - pmarius/wrkbench-pages-react19
concurrency:
  group: wrkbench-client-architecture-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        working-directory: next
        run: bun install
      - name: Typecheck real React 19, Cordis, Dockview packages
        working-directory: next
        run: bun run typecheck
      - name: Verify plugin boundaries and imports
        working-directory: next
        run: bun run test:core
      - name: Build Pages application
        working-directory: next
        run: bun run build
      - name: Require entrypoint
        run: test -s next/dist/index.html
      - name: Preserve compiled client for independent browser inspection
        uses: actions/upload-artifact@v4
        with:
          name: wrkbench-client-dist
          path: next/dist/
      - name: Install Chromium for normal HTTP-origin acceptance
        working-directory: next
        run: bunx playwright install --with-deps chromium
      - name: Browser acceptance tests
        working-directory: next
        run: bun run test:e2e
      - name: Preserve traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrkbench-architecture-playwright
          path: next/test-results/
          if-no-files-found: ignore
