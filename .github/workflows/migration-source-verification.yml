# Intentional PR-only verification of inert migration source snapshots.
# No push/main trigger, release job, Pages publication, write permission or secrets.
name: Migration source verification
on:
  pull_request:
    paths:
      - "migrate/**"
      - "docs/migrations/**"
      - "bunfig.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/migration-source-verification.yml"

permissions:
  contents: read

concurrency:
  group: migration-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  history-and-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source history, exact trees and root isolation
        run: python3 migrate/verify.py
      - name: Verify all 77 historical refs and RSCode branch dispositions
        run: python3 migrate/verify_branch_disposition.py

  rscode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: migrate/rscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Generate CycloneDX SBOM (lock + available package metadata)
        run: python3 ../../migrate/sbom.py bun.lock node_modules > "$GITHUB_WORKSPACE/rscode.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-rscode
          path: rscode.cdx.json
          retention-days: 30
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test src

  # RSC-ROOT PR #40 originally required three independent Chromium stress
  # replicas with ten complete launch/stream/resize/dialog cycles each.
  # Run the *migrated* service, not the inactive root service. PR-only/read-only.
  rscode-chromium-stress:
    name: RSC-ROOT migrated Chromium stress replica ${{ matrix.replica }}
    env:
      RSCODE_BROWSER_STRESS_TRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: migrate/rscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Provision real headless Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Repeat browser launch, actual PNG frames, resize, dialogs and teardown
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 10); do
            echo "::group::migrated Chromium stress replica ${{ matrix.replica }} iteration ${iteration}/10"
            bun test src/tests/browserService.test.ts 2>&1 | tee "$RUNNER_TEMP/rscode-chromium-${iteration}.log"
            echo "::endgroup::"
          done
      - name: Retain Chromium stress diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rscode-chromium-stress-${{ matrix.replica }}-failure
          path: ${{ runner.temp }}/rscode-chromium-*.log
          if-no-files-found: warn
          retention-days: 14

  # Real Windows validation of the provisional native filesystem source.
  # Does not package, publish, deploy or claim complete Windows native acceptance.
  rscode-windows-paths:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: migrate/rscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Verify Windows workspace persistence and path containment
        run: bun test src/tests/store.test.ts

  ghcode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: migrate/ghcode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Generate CycloneDX SBOM (lock + available package metadata)
        run: python3 ../../migrate/sbom.py bun.lock node_modules > "$GITHUB_WORKSPACE/ghcode.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-ghcode
          path: ghcode.cdx.json
          retention-days: 30
      - run: bun run check
      - name: W02 transactional write and principal-fence regression tests
        run: bun test ./.github/unit/storage-unit.test.ts ./.github/unit/document-service.test.ts ./.github/unit/resource-identity.test.ts ./.github/unit/github-cas.test.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun run acceptance
        env:
          PUBLIC_GITHUB_OAUTH_CLIENT_ID: test-client-id
          PUBLIC_GITHUB_AUTH_BROKER_URL: http://127.0.0.1:4173/__auth/github

  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: migrate/canvas/.github/app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Generate CycloneDX SBOM (lock + available package metadata)
        run: python3 ../../../../migrate/sbom.py bun.lock node_modules > "$GITHUB_WORKSPACE/canvas.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-canvas
          path: canvas.cdx.json
          retention-days: 30
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - name: Verify native Chromium IndexedDB acceptance
        run: node ../../.github/tests/persistence/canvas-persistence.mjs
      - name: Verify standalone source-driven Canvas UI
        run: node ../../.github/tests/smoke_canvas.mjs ../../.canvas-dist/index.html
      - name: Bundle read-only injected repository adapter harness
        run: bun build tests/runtime-repository-browser-harness.ts --target browser --outfile ../../.github/tests/runtime-repository-browser.bundle.js
      - name: Verify injected source switching, stale promises and forbidden repository identity in Chromium
        run: node ../../.github/tests/runtime-repository-browser.mjs ../../.github/tests/runtime-repository-browser.bundle.js
